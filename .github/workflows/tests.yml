name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v6

      - name: Installer uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Installer les dépendances (versions du fichier uv.lock)
        run: uv sync --locked

      - name: Lancer les tests
        run: uv run python -m pytest -v
